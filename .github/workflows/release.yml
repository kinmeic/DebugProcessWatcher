name: Build And Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            artifact_suffix: arm64
          - arch: x64
            runner: macos-15-intel
            artifact_suffix: x64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Release
        run: swift build -c release

      - name: Package App Bundle
        run: |
          mkdir -p "Artifacts/Release/${{ matrix.arch }}"
          BUILD_CONFIGURATION=release \
          OUTPUT_APP_DIR="$PWD/Artifacts/Release/${{ matrix.arch }}/DebugProcessWatcher.app" \
          ./Scripts/package-app.sh

      - name: Ad Hoc Sign App
        run: codesign --force --deep --sign - "Artifacts/Release/${{ matrix.arch }}/DebugProcessWatcher.app"

      - name: Create Zip Archive
        run: |
          mkdir -p Artifacts/ReleaseZips
          ditto -c -k --keepParent \
            "Artifacts/Release/${{ matrix.arch }}/DebugProcessWatcher.app" \
            "Artifacts/ReleaseZips/DebugProcessWatcher-macOS-${{ matrix.artifact_suffix }}.zip"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact_suffix }}
          path: Artifacts/ReleaseZips/DebugProcessWatcher-macOS-${{ matrix.artifact_suffix }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: Artifacts/Release
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Artifacts/Release/*.zip
          generate_release_notes: true
